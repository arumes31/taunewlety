<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Preview - TauNewlety</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <style>
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 2rem; display: flex; justify-content: center; }
        .preview-container { background: white; width: 100%; max-width: 600px; padding: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="preview-container">
        <h3>Subject: {{.subject}}</h3>
        <hr>
        {{.content}}
    </div>
</body>
</html>
