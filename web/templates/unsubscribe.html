<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - TauNewlety</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .captcha-question { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; color: #007bff; }
        button { width: 100%; padding: 0.75rem; background: #dc3545; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Unsubscribe</h1>
        <p>Please confirm you want to unsubscribe <strong>{{.email}}</strong>.</p>
        <form action="/unsubscribe" method="POST">
            <input type="hidden" name="email" value="{{.email}}">
            <div class="form-group">
                <label>Security Check: What is {{.question}}?</label>
                <div class="captcha-question">{{.question}} = ?</div>
                <input type="number" name="answer" placeholder="Your answer" required autofocus>
            </div>
            <button type="submit">Confirm Unsubscribe</button>
        </form>
    </div>
</body>
</html>
