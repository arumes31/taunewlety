<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - TauNewlety</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            text-align: center;
        }

        h1 {
            color: #dc3545;
            font-size: 1.4rem;
            margin-top: 0;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.4rem;
            background: #007bff;
            color: white;
            border-radius: 4px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>{{if .title}}{{.title}}{{else}}Something went wrong{{end}}</h1>
        <p>{{if .message}}{{.message}}{{else}}The server could not complete your request.{{end}}</p>
        <p style="font-size: 0.85rem; color: #888;">Check the server logs for details.</p>
        <a href="/">Back to dashboard</a>
    </div>
</body>

</html>
