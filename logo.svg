<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .sound-bar { fill: #00F2FE; }
    
    @keyframes wave {
      0%, 100% { height: 10px; }
      50% { height: 70px; }
    }
    .w1 { animation: wave 1.2s infinite ease-in-out; }
    .w2 { animation: wave 1.2s infinite ease-in-out 0.3s; }
    .w3 { animation: wave 1.2s infinite ease-in-out 0.6s; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #FFF; font-size: 32px; letter-spacing: 2px; }
  </style>

  <!-- Transparent Background -->

  <!-- Left Spectrum -->
  <g transform="translate(100, 205)">
    <rect x="0" y="30" width="6" height="10" rx="3" class="sound-bar w1" filter="url(#glow)"/>
    <rect x="12" y="15" width="6" height="40" rx="3" class="sound-bar w2" filter="url(#glow)"/>
    <rect x="24" y="0" width="6" height="70" rx="3" class="sound-bar w3" filter="url(#glow)"/>
    <rect x="36" y="20" width="6" height="30" rx="3" class="sound-bar w1" filter="url(#glow)"/>
    <rect x="48" y="35" width="6" height="10" rx="3" class="sound-bar w2" filter="url(#glow)"/>
  </g>

  <!-- Right Spectrum -->
  <g transform="translate(440, 205)">
    <rect x="48" y="30" width="6" height="10" rx="3" class="sound-bar w1" filter="url(#glow)"/>
    <rect x="36" y="15" width="6" height="40" rx="3" class="sound-bar w2" filter="url(#glow)"/>
    <rect x="24" y="0" width="6" height="70" rx="3" class="sound-bar w3" filter="url(#glow)"/>
    <rect x="12" y="20" width="6" height="30" rx="3" class="sound-bar w1" filter="url(#glow)"/>
    <rect x="0" y="35" width="6" height="10" rx="3" class="sound-bar w2" filter="url(#glow)"/>
  </g>

  <!-- Envelope -->
  <rect x="210" y="185" width="180" height="110" rx="8" fill="#1B2435" stroke="#00F2FE" stroke-width="4.5" filter="url(#glow)"/>
  <path d="M 210,185 L 300,245 L 390,185" fill="none" stroke="#00F2FE" stroke-width="3"/>

  <text x="300" y="520" text-anchor="middle" class="title">
    TAU<tspan fill="#4FACFE">NEWLETY</tspan>
  </text>
</svg>
