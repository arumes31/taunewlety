version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_USER=${APP_USER:-admin}
      - APP_PASS=${APP_PASS:-password}
      - SESSION_SECRET=${SESSION_SECRET:-taunewlety-2026-prod-secret}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - DB_PATH=/data/taunewlety.db
    volumes:
      - ./data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
      - ./scripts/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    environment:
      - OLLAMA_MODEL=llama3.2:3b

