services:
  app:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_USER=${APP_USER:?APP_USER is required}
      - APP_PASS=${APP_PASS:?APP_PASS is required}
      - SESSION_SECRET=${SESSION_SECRET}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_USER=${DB_USER:-tauuser}
      - DB_PASSWORD=${DB_PASSWORD:-taupass}
      - DB_NAME=${DB_NAME:-taunewlety}
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-tauuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-taupass}
      - POSTGRES_DB=${DB_NAME:-taunewlety}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tauuser} -d ${DB_NAME:-taunewlety}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ../../scripts/sh/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    environment:
      - OLLAMA_MODEL=llama3.2:3b

volumes:
  postgres_data:
  ollama_data:
