services:
  app:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    ports:
      # Bound to loopback so the app is not reachable from the network in a way
      # that bypasses the TLS reverse proxy. Point the proxy at 127.0.0.1:8080,
      # or drop this mapping entirely and attach the proxy to this network.
      - "127.0.0.1:8080:8080"
    environment:
      - APP_USER=${APP_USER:?APP_USER is required}
      - APP_PASS=${APP_PASS:?APP_PASS is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - DB_TYPE=postgres
      # Defaults to the bundled db service; override in .env to point at an
      # external PostgreSQL server.
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-tauuser}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-taunewlety}
      # The bundled Postgres serves no TLS and is only reachable on this
      # internal network. Set DB_SSLMODE=verify-full in .env alongside
      # DB_HOST when using an external database (plus DB_SSLROOTCERT, a
      # container path, if its CA is not publicly trusted).
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-}
      # Direct HTTPS: set both in .env (to container paths) and uncomment the
      # certificate mounts below.
      - TLS_CERT=${TLS_CERT:-}
      - TLS_KEY=${TLS_KEY:-}
      # Set to the reverse proxy's address(es) (comma-separated IPs/CIDRs) so
      # the login rate limit sees real client IPs, e.g. 172.16.0.0/12.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # The session cookie is Secure by default; set COOKIE_SECURE=false only
      # for local testing over plain HTTP.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-12h}
      # Optional: separate key for unsubscribe links (defaults to SESSION_SECRET).
      - UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET:-}
      # Optional: encrypts stored integration secrets (SMTP password, API
      # tokens). Keep it safe: losing it means re-entering those secrets.
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-}
    # volumes:
    #   - ./certs/cert.pem:/certs/cert.pem:ro
    #   - ./certs/key.pem:/certs/key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: postgres:16.15-alpine3.24@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    environment:
      - POSTGRES_USER=${DB_USER:-tauuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=${DB_NAME:-taunewlety}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tauuser} -d ${DB_NAME:-taunewlety}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    ports:
      # Loopback only: the Ollama API is unauthenticated, and the app reaches
      # it over the internal network as http://ollama:11434 regardless.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ../../scripts/sh/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    environment:
      - OLLAMA_MODEL=llama3.2:3b

volumes:
  postgres_data:
  ollama_data:
